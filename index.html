<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>РОСТ — превью сайта</title>
<style>
  :root{--ink:#101917;--paper:#fafaf7;--muted:#59615e;--teal:#00d8c4;--line:rgba(16,25,23,.14)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;padding:24px}
  main{width:min(640px,100%);text-align:center}
  h1{font-size:clamp(1.4rem,3vw,1.9rem);margin:0 0 10px;letter-spacing:-.02em}
  p{color:var(--muted);margin:0 0 28px;font-size:.95rem;line-height:1.5}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  a.opt{display:block;padding:22px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:1.05rem;transition:border-color .2s,transform .2s}
  a.opt:hover{border-color:var(--teal);transform:translateY(-2px)}
  a.opt small{display:block;margin-top:6px;color:var(--muted);font-weight:400;font-size:.82rem}
</style>
</head>
<body>
<main>
  <h1>РОСТ — превью сайта</h1>
  <p>Выберите вариант для просмотра.</p>
  <div class="opts">
    <a class="opt" href="v1/">Вариант 1<small>Строительство и ремонт</small></a>
    <a class="opt" href="v2/">Вариант 2<small>Строительство и ремонт</small></a>
  </div>
</main>
</body>
</html>
